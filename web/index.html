<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astro Recommender</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0e1322; --panel: #171e30; --field: #0b101c; --fg: #e6eaf2; --muted: #8b94a7; --line: #2a3349;
  --accent: #e9b44c; --accent-fg: #1a1203; --accent-soft: rgba(233, 180, 76, .14); --focus: #f3cf7a;
  --c31: #ff7b72; --c32: #6fd28a; --c33: #e9b44c; --c34: #6cb4f5; --c35: #d89af0; --c36: #4fc8d6; --c90: #7f889b;
  --dusk: linear-gradient(90deg, #22305e 0%, #4a4f8a 40%, #c0683a 75%, #e9b44c 100%);
  --title: linear-gradient(90deg, #9db1f5 0%, #c9a6d8 45%, #e9b44c 100%);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f2f4f8; --panel: #fff; --field: #f7f8fb; --fg: #151b29; --muted: #5f6878; --line: #d6dbe6;
  --accent: #a8690f; --accent-fg: #fff; --accent-soft: rgba(168, 105, 15, .12); --focus: #c98a1f;
  --c31: #c0392b; --c32: #1f8a4c; --c33: #a8690f; --c34: #1f6fd0; --c35: #9b3fc4; --c36: #0f7f8c; --c90: #7a8294;
  --title: linear-gradient(90deg, #22305e 0%, #4a4f8a 45%, #a8690f 100%);
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  border-top: 4px solid transparent; border-image: var(--dusk) 1;
}
main { max-width: 1400px; margin: 0 auto; padding: 28px 20px 48px; }
header { margin-bottom: 22px; }
h1 {
  display: flex; align-items: center; gap: 12px; margin: 0 0 6px;
  font-size: clamp(1.7rem, 1.2rem + 1.6vw, 2.4rem); font-weight: 750; letter-spacing: -.03em; line-height: 1.1;
}
h1 .mark { flex: none; width: .9em; height: .9em; color: var(--accent); filter: drop-shadow(0 0 6px var(--accent-soft)); }
h1 .word { background: var(--title); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .05em; }
header p { margin: 0; color: var(--muted); max-width: 72ch; }
form { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 18px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; min-width: 0; }
label > span { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; white-space: nowrap; }
label small { color: var(--muted); line-height: 1.35; }
label.check { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 10px; }
label.check small { grid-column: 1 / -1; }
input, select {
  font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px;
  background: var(--field); color: var(--fg); width: 100%; transition: border-color .12s, box-shadow .12s;
}
input::placeholder { color: var(--muted); }
input:focus-visible, select:focus-visible, button:focus-visible, summary:focus-visible {
  outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px var(--accent-soft);
}
input[type=checkbox] { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); }
input[type=file] { padding: 5px; }
input[type=file]::file-selector-button {
  font: inherit; font-size: 13px; padding: 3px 9px; margin-right: 8px; border: 1px solid var(--line);
  border-radius: 5px; background: var(--panel); color: var(--fg); cursor: pointer;
}
details { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; color: var(--accent); font-weight: 500; width: max-content; border-radius: 5px; padding: 2px 4px; margin-left: -4px; }
summary::marker { color: var(--muted); }
details .grid { margin-top: 14px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; align-items: center; }
button {
  font: inherit; font-weight: 600; padding: 8px 18px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); transition: filter .12s, background .12s;
}
button:hover:not(:disabled) { filter: brightness(1.08); }
button.ghost { background: transparent; color: var(--accent); font-weight: 500; }
button.ghost:hover:not(:disabled) { background: var(--accent-soft); filter: none; }
button:disabled { opacity: .5; cursor: default; }
#status { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; margin-left: auto; }
#warn { white-space: pre-wrap; color: var(--c33); font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 18px 0 0; }
#warn:not(:empty) { padding: 10px 14px; border-left: 3px solid var(--c33); background: var(--panel); border-radius: 0 8px 8px 0; }
#warn.error { color: var(--c31); border-left-color: var(--c31); }
pre#out {
  margin: 18px 0 0; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  overflow-x: auto; font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; tab-size: 4;
}
pre#out:empty { display: none; }
.b { font-weight: 700; }
.c31 { color: var(--c31); } .c32 { color: var(--c32); } .c33 { color: var(--c33); } .c34 { color: var(--c34); }
.c35 { color: var(--c35); } .c36 { color: var(--c36); } .c90 { color: var(--c90); }
footer {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px;
  margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted);
}
footer a { color: var(--accent); text-decoration: none; }
footer a:hover { text-decoration: underline; }
@media (max-width: 600px) {
  main { padding: 20px 14px 40px; }
  form { padding: 16px; border-radius: 10px; }
  #status { margin-left: 0; flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script>
// Theme before first paint: a stored override, else the browser's preference
// (kept live until the user overrides it).
(() => {
  const media = matchMedia("(prefers-color-scheme: light)");
  const apply = () => {
    let t = null;
    try { t = localStorage.getItem("astro-recommender-theme"); } catch {}
    document.documentElement.dataset.theme = t ?? (media.matches ? "light" : "dark");
    document.documentElement.dataset.themeChoice = t ?? "auto";
  };
  apply();
  media.addEventListener("change", apply);
  globalThis.applyTheme = apply;
})();
</script>
</head>
<body>
<main>
  <header>
    <h1><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5c.6 5.3 3.8 9.3 10.5 10.5C15.8 13.2 12.6 17.2 12 22.5 11.4 17.2 8.2 13.2 1.5 12 8.2 10.8 11.4 6.8 12 1.5z"/></svg><span class="word">Astro Recommender</span></h1>
    <p>Ranks deep sky objects for tonight at your location. Runs entirely in your browser; the only network requests go to the forecast, sky brightness, geocoding and comet services. Leave a field empty for its default.</p>
  </header>
  <form id="form">
    <div class="grid" id="main"></div>
    <details><summary>All options</summary><div class="grid" id="more"></div></details>
    <div class="bar">
      <button type="submit" id="run" disabled>Loading…</button>
      <button type="button" class="ghost" id="here">Use my location</button>
      <button type="button" class="ghost" id="clear">Reset</button>
      <button type="button" class="ghost" id="theme" title="Switch between the browser's theme, light and dark"></button>
      <span id="status"></span>
    </div>
  </form>
  <div id="warn"></div>
  <pre id="out"></pre>
  <footer>
    <span>© 2026 Dinko Korunic</span>
    <span>Code: <a rel="license" href="https://github.com/dkorunic/astro-recommender/blob/main/LICENSE">MIT</a> · <a href="https://github.com/dkorunic/astro-recommender/">GitHub</a></span>
  </footer>
</main>
<script src="wasm_exec.js"></script>
<script>
"use strict";
// The Go program runs unchanged: argv comes from the form, stdout/stderr and
// the -targets/-horizon files go through the fs shim that wasm_exec.js calls.
const MAIN = ["lat", "lon", "date", "tz", "list", "n", "plan", "origin", "filter", "bortle", "sqm"];
const FILES = ["targets", "horizon"];
const HIDDEN = ["version"]; // nothing to show
const KEY = "astro-recommender-form";
const $ = (id) => document.getElementById(id);

// fs shim: fd 1/2 to the current run's sinks, uploaded files read-only.
// The Go runtime prints panics through writeSync, not write.
const files = new Map(); // path -> Uint8Array
const open = new Map();  // fd -> {data, pos}
let nextFD = 100, sink = null;
const enoent = () => Object.assign(new Error("no such file"), { code: "ENOENT" });
Object.assign(globalThis.fs, {
  writeSync(fd, buf) {
    sink?.(fd, buf);
    return buf.length;
  },
  write(fd, buf, offset, length, position, cb) {
    cb(null, this.writeSync(fd, buf.subarray(offset, offset + length)));
  },
  open(path, flags, mode, cb) {
    const data = files.get(path);
    if (!data || flags !== 0) return cb(enoent());
    open.set(nextFD, { data, pos: 0 });
    cb(null, nextFD++);
  },
  fstat(fd, cb) {
    const f = open.get(fd);
    if (!f) return cb(enoent());
    cb(null, { dev: 0, ino: 0, mode: 0o100444, nlink: 1, uid: 0, gid: 0, rdev: 0, size: f.data.length,
      blksize: 4096, blocks: 0, atimeMs: 0, mtimeMs: 0, ctimeMs: 0, isDirectory: () => false });
  },
  read(fd, buf, offset, length, position, cb) {
    const f = open.get(fd);
    if (!f) return cb(enoent());
    const at = position ?? f.pos;
    const chunk = f.data.subarray(at, at + length);
    buf.set(chunk, offset);
    if (position == null) f.pos += chunk.length;
    cb(null, chunk.length);
  },
  close(fd, cb) { open.delete(fd); cb(null); },
});

// run executes the program once with args and resolves to {out, err, code}.
let modulePromise = fetch("app.wasm").then((r) => {
  if (!r.ok) throw new Error(`app.wasm: HTTP ${r.status}`);
  return r.arrayBuffer();
}).then((b) => WebAssembly.compile(b));
// Runs share the fs sink, so they queue; argv0 "tz" is main_js.go's lookup.
let queue = Promise.resolve();
function run(args, argv0 = "astro-recommender") {
  const p = queue.then(() => runNow(args, argv0));
  queue = p.catch(() => {});
  return p;
}
async function runNow(args, argv0) {
  const dec = { 1: new TextDecoder(), 2: new TextDecoder() };
  const text = { 1: "", 2: "" };
  sink = (fd, bytes) => { if (dec[fd]) text[fd] += dec[fd].decode(bytes, { stream: true }); };
  const go = new Go();
  let code = 0;
  go.argv = [argv0, ...args];
  go.env = { CLICOLOR_FORCE: "1" };
  go.exit = (c) => { code = c; };
  const inst = await WebAssembly.instantiate(await modulePromise, go.importObject);
  await go.run(inst);
  sink = null;
  return { out: text[1] + dec[1].decode(), err: text[2] + dec[2].decode(), code };
}

// ansi turns the SGR codes paint() writes into spans; codes may nest.
function ansi(s) {
  const esc = (t) => t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
  let html = "", depth = 0;
  for (const [i, part] of s.split(/\x1b\[(\d+)m/).entries()) {
    if (i % 2 === 0) { html += esc(part); continue; }
    if (part === "0") { if (depth) { html += "</span>"; depth--; } continue; }
    html += `<span class="${part === "01" || part === "1" ? "b" : "c" + part}">`;
    depth++;
  }
  return html + "</span>".repeat(depth);
}

// parseUsage reads the flag list from -h, so the form follows the program.
function parseUsage(text) {
  const flags = [];
  for (const line of text.split("\n")) {
    const m = line.match(/^  -(\S+)(?: (\S+))?$/);
    if (m) { flags.push({ name: m[1], type: m[2] || "bool", desc: "" }); continue; }
    if (flags.length && line.startsWith("    \t")) flags.at(-1).desc += line.slice(5);
  }
  for (const f of flags) {
    // Go quotes string defaults; an unquoted one is part of the help (-date).
    const d = f.desc.match(f.type === "string" ? / \(default "(.*)"\)$/ : / \(default (.*)\)$/);
    if (d) { f.def = d[1]; f.desc = f.desc.slice(0, d.index); }
  }
  return flags.filter((f) => !HIDDEN.includes(f.name));
}

function field(f) {
  const label = document.createElement("label");
  label.title = f.desc;
  let input;
  if (f.type === "bool") {
    label.className = "check";
    input = Object.assign(document.createElement("input"), { type: "checkbox" });
    label.append(input, Object.assign(document.createElement("span"), { textContent: "-" + f.name }));
  } else {
    if (FILES.includes(f.name)) {
      input = Object.assign(document.createElement("input"), { type: "file" });
    } else if (f.name === "list") {
      input = document.createElement("select");
      const names = f.desc.split(": ")[1]?.split(", ") ?? [];
      if (!names.includes(f.def)) throw new Error(`-list help has no "name, name" list: ${f.desc}`);
      for (const n of names) input.add(new Option(n, n === f.def ? "" : n, n === f.def));
    } else {
      input = Object.assign(document.createElement("input"), { type: "text", placeholder: f.def ?? "" });
      if (f.type === "float" || f.type === "int") input.inputMode = "decimal";
      if (f.name === "date") input.type = "date";
    }
    label.append(Object.assign(document.createElement("span"), { textContent: "-" + f.name }), input);
  }
  label.append(Object.assign(document.createElement("small"), { textContent: f.desc }));
  input.name = f.name;
  return label;
}

function save() {
  const v = {};
  for (const el of $("form").elements) {
    // A remembered -date would silently replace tonight on the next visit.
    if (!el.name || el.type === "file" || el.name === "date") continue;
    v[el.name] = el.type === "checkbox" ? el.checked : el.value;
  }
  try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {}
}
function restore() {
  let v = {};
  try { v = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch {}
  for (const el of $("form").elements) {
    if (!(el.name in v) || el.name === "date") continue; // older saves kept it
    if (el.type === "checkbox") el.checked = v[el.name]; else el.value = v[el.name];
  }
}

// args lists only the fields given, so flag.Visit sees what the user set.
async function args() {
  const a = [];
  files.clear();
  for (const el of $("form").elements) {
    if (!el.name) continue;
    if (el.type === "checkbox") { if (el.checked) a.push("-" + el.name); continue; }
    if (el.type === "file") {
      const file = el.files[0];
      if (!file) continue;
      const path = `/${el.name}/${file.name}`;
      files.set(path, new Uint8Array(await file.arrayBuffer()));
      a.push("-" + el.name, path);
      continue;
    }
    const v = el.value.trim();
    if (v !== "") a.push("-" + el.name, v);
  }
  return a;
}

// zone shows the location's time zone as the -tz placeholder: the field stays
// empty, so the program looks it up itself and a typed -tz still wins. Each
// lookup is a Go run (queued behind any recommendation), so answers are cached
// and the placeholder is blanked, never stale, while one is pending.
const zones = new Map(); // JSON [lat, lon] -> zone; only successes, so a failure retries
function zone() {
  const { lat, lon, tz } = $("form").elements;
  const at = () => JSON.stringify([lat.value.trim(), lon.value.trim()]);
  const key = at();
  tz.placeholder = zones.get(key) ?? "";
  if (zones.has(key) || JSON.parse(key).includes("")) return;
  run(JSON.parse(key), "tz").then(({ out, code }) => {
    if (code !== 0) return;
    zones.set(key, out.trim());
    if (key === at()) tz.placeholder = out.trim();
  }).catch((ex) => console.warn("time zone lookup:", ex));
}

async function init() {
  const { err } = await run(["-h"]);
  const flags = parseUsage(err);
  const byName = Object.fromEntries(flags.map((f) => [f.name, f]));
  for (const n of MAIN) {
    if (!byName[n]) throw new Error(`-h lists no -${n}`);
    $("main").append(field(byName[n]));
  }
  for (const f of flags) if (!MAIN.includes(f.name)) $("more").append(field(f));
  restore();
  const el = $("form").elements;
  el.lat.addEventListener("change", zone);
  el.lon.addEventListener("change", zone);
  zone();
  $("run").disabled = false;
  $("run").textContent = "Run";
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  save();
  $("run").disabled = true;
  $("status").textContent = "Running…";
  const t0 = performance.now();
  try {
    const a = await args();
    const { out, err, code } = await run(a);
    $("out").innerHTML = ansi(out);
    $("warn").textContent = err.trim();
    $("warn").className = code ? "error" : "";
    $("status").textContent = code ? `exit status ${code}` : `done in ${((performance.now() - t0) / 1000).toFixed(1)} s`;
  } catch (ex) {
    $("warn").className = "error";
    $("warn").textContent = String(ex);
    $("status").textContent = "";
  }
  $("run").disabled = false;
});

$("here").addEventListener("click", () => {
  if (!navigator.geolocation) { $("status").textContent = "geolocation unavailable"; return; }
  $("status").textContent = "Locating…";
  navigator.geolocation.getCurrentPosition((p) => {
    $("form").elements.lat.value = p.coords.latitude.toFixed(4);
    $("form").elements.lon.value = p.coords.longitude.toFixed(4);
    $("status").textContent = "";
    zone();
  }, (ex) => { $("status").textContent = ex.message; });
});

// The theme button cycles auto (the browser's choice) -> light -> dark.
const THEME = "astro-recommender-theme";
function themeLabel() {
  const choice = document.documentElement.dataset.themeChoice;
  $("theme").textContent = choice === "auto" ? `Theme: auto (${document.documentElement.dataset.theme})` : `Theme: ${choice}`;
}
$("theme").addEventListener("click", () => {
  const next = { auto: "light", light: "dark", dark: null }[document.documentElement.dataset.themeChoice];
  try { next ? localStorage.setItem(THEME, next) : localStorage.removeItem(THEME); } catch {}
  applyTheme();
  themeLabel();
});
matchMedia("(prefers-color-scheme: light)").addEventListener("change", themeLabel);
themeLabel();

$("clear").addEventListener("click", () => {
  $("form").reset();
  try { localStorage.removeItem(KEY); } catch {}
  zone();
});

init().catch((ex) => {
  $("warn").className = "error";
  $("warn").textContent = String(ex);
  $("run").textContent = "Failed to load";
});
</script>
</body>
</html>
