version: 2
before:
  hooks:
    - go mod tidy
    # Fail on a stale embedded list rather than regenerate it: the release
    # must be what was committed (task lists, then commit the .gob files).
    - go test -count=1 -run '^TestEmbeddedLists$' ./internal/catalog
builds:
  - flags:
      - -trimpath
      - -pgo=auto
    env:
      - CGO_ENABLED=0
    ldflags: |
      -s -w -extldflags '-static' -X "main.GitTag={{.Tag}}" -X "main.GitCommit={{.ShortCommit}}" -X "main.GitDirty= " -X "main.BuildTime={{.Date}}"
    goos: &goos
      - linux
      - darwin
      - windows
    goarch: &goarch
      - amd64
      - arm
      - arm64
    goarm: &goarm
      - 6
      - 7
    ignore: &ignore
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: arm
  - id: astro-notify
    main: ./cmd/astro-notify
    binary: astro-notify
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    ldflags: |
      -s -w -extldflags '-static'
    goos: *goos
    goarch: *goarch
    goarm: *goarm
    ignore: *ignore
universal_binaries:
  - replace: true
  - id: astro-notify
    name_template: astro-notify
    replace: true
changelog:
  sort: asc
archives:
  - name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
      {{- if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ .Tag }}-next"
brews:
  - name: astro-recommender
    directory: Formula
    repository:
      owner: dkorunic
      name: homebrew-tap
    homepage: https://github.com/dkorunic/astro-recommender
    description: Ranks deep sky objects and bright comets to image tonight from a given location
    license: MIT
    test: |
      system "#{bin}/astro-recommender", "-version"
    install: |
      bin.install "astro-recommender"
      bin.install "astro-notify"
homebrew_casks:
  - name: astro-recommender
    binaries: [astro-recommender, astro-notify]
    repository:
      owner: dkorunic
      name: homebrew-tap
    homepage: https://github.com/dkorunic/astro-recommender
    description: Ranks deep sky objects and bright comets to image tonight from a given location
    license: MIT
    # Remove the macOS quarantine attribute so the CLI runs without Gatekeeper prompts
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/astro-recommender"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/astro-notify"]
          end
